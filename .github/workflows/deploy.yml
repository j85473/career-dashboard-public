name: Validate public source

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Keep private candidate evidence out of the public tree
        run: |
          test ! -e docs/Candidate_Evidence_Inventory_-_Core_v1.md
          test ! -e .agents/minified_evidence.json
          test ! -e .agents/agents/standard-job-evaluator-v6/agent.md

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Run tests
        run: npm test

      - name: Build application
        run: npm run build
